<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HUM Map Dispatcher</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #09090b;
    }
    #map {
      width: 100vw;
      height: 100vh;
    }
    .locate-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 1000;
      background: #10b981;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-family: system-ui, -apple-system, sans-serif;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
      transition: background 0.2s ease, transform 0.1s ease;
    }
    .locate-btn:hover {
      background: #059669;
    }
    .locate-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>
  <button class="locate-btn" onclick="locateUser()">Locate Me</button>
  <div id="map"></div>
  <script>
    // Initialize map centered on Ernakulam, Kochi, Kerala
    var map = L.map('map', { zoomControl: false }).setView([9.9777, 76.2758], 13);
    
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    L.control.zoom({
      position: 'bottomright'
    }).addTo(map);

    // Marker icons
    var greenIcon = L.icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
      shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
      iconSize: [25, 41],
      iconAnchor: [12, 41],
      popupAnchor: [1, -34],
      shadowSize: [41, 41]
    });

    var redIcon = L.icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
      shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
      iconSize: [25, 41],
      iconAnchor: [12, 41],
      popupAnchor: [1, -34],
      shadowSize: [41, 41]
    });

    // Pin markers
    var pickupMarker = L.marker([9.9777, 76.2758], { icon: greenIcon, draggable: true }).addTo(map);
    var dropoffMarker = null;
    var routePolyline = null;
    var carMarker = null;

    function reverseGeocode(lat, lng) {
      fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat=' + lat + '&lon=' + lng, {
        headers: {
          'Accept-Language': 'en'
        }
      })
      .then(response => response.json())
      .then(data => {
        var address = data.display_name || (lat.toFixed(4) + ", " + lng.toFixed(4));
        window.parent.postMessage({ type: 'MAP_LOCATION_SELECTED', address: address, lat: lat, lng: lng }, '*');
      })
      .catch(err => {
        console.error("Geocoding failed:", err);
        window.parent.postMessage({ type: 'MAP_LOCATION_SELECTED', address: lat.toFixed(5) + ", " + lng.toFixed(5), lat: lat, lng: lng }, '*');
      });
    }

    // Click on map to place pin
    map.on('click', function(e) {
      if (carMarker) return; // Prevent clicking during active trip animation
      pickupMarker.setLatLng(e.latlng);
      map.panTo(e.latlng);
      reverseGeocode(e.latlng.lat, e.latlng.lng);
    });

    // Drag pin to update location
    pickupMarker.on('dragend', function(e) {
      var position = pickupMarker.getLatLng();
      reverseGeocode(position.lat, position.lng);
    });

    // Browser Geolocation
    function locateUser(isSilent) {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function(position) {
          var lat = position.coords.latitude;
          var lng = position.coords.longitude;
          var newLatLng = new L.LatLng(lat, lng);
          pickupMarker.setLatLng(newLatLng);
          map.setView(newLatLng, 16);
          reverseGeocode(lat, lng);
        }, function(error) {
          if (!isSilent) {
            alert("Location permission denied. Defaulting to New Delhi center.");
          }
        });
      } else {
        if (!isSilent) {
          alert("Geolocation is not supported by this browser.");
        }
      }
    }

    // Auto-locate user on startup
    locateUser(true);

    // --- PARENT WINDOW EVENT MESSAGES ---
    window.addEventListener('message', function(event) {
      if (!event.data) return;

      if (event.data.type === 'DRAW_ROUTE') {
        var pk = event.data.pickup;
        var dp = event.data.dropoff;

        // Reset any existing elements
        if (dropoffMarker) map.removeLayer(dropoffMarker);
        if (routePolyline) map.removeLayer(routePolyline);
        if (carMarker) map.removeLayer(carMarker);

        // Place pickup marker
        pickupMarker.setLatLng([pk.lat, pk.lng]);

        // Place drop-off marker
        dropoffMarker = L.marker([dp.lat, dp.lng], { icon: redIcon }).addTo(map);

        // Draw routing polyline line
        routePolyline = L.polyline([[pk.lat, pk.lng], [dp.lat, dp.lng]], {
          color: '#10b981',
          weight: 4,
          opacity: 0.8,
          dashArray: '10, 10'
        }).addTo(map);

        // Fit map bounds to show full route
        var bounds = L.latLngBounds([[pk.lat, pk.lng], [dp.lat, dp.lng]]);
        map.fitBounds(bounds, { padding: [60, 60] });
      }

      if (event.data.type === 'ANIMATE_CAR') {
        var pk = event.data.pickup;
        var dp = event.data.dropoff;

        if (carMarker) map.removeLayer(carMarker);

        var carIcon = L.divIcon({
          html: '<div style="font-size: 32px; transform: scaleX(-1); filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5));">🚗</div>',
          iconSize: [32, 32],
          iconAnchor: [16, 16]
        });

        carMarker = L.marker([pk.lat, pk.lng], { icon: carIcon }).addTo(map);

        var startTime = null;
        var duration = 9000; // Animate over 9 seconds

        function animate(timestamp) {
          if (!startTime) startTime = timestamp;
          var progress = (timestamp - startTime) / duration;
          if (progress > 1) progress = 1;

          var curLat = pk.lat + (dp.lat - pk.lat) * progress;
          var curLng = pk.lng + (dp.lng - pk.lng) * progress;

          carMarker.setLatLng([curLat, curLng]);

          if (progress < 1) {
            requestAnimationFrame(animate);
          } else {
            // Arrived! Pop up success
            carMarker.bindPopup("<b>Arrived!</b>").openPopup();
          }
        }
        requestAnimationFrame(animate);
      }

      if (event.data.type === 'RESET_MAP') {
        if (dropoffMarker) map.removeLayer(dropoffMarker);
        if (routePolyline) map.removeLayer(routePolyline);
        if (carMarker) map.removeLayer(carMarker);
        pickupMarker.setLatLng([28.6304, 77.2177]);
        map.setView([28.6304, 77.2177], 13);
      }
    });
  </script>
</body>
</html>
