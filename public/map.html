<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HUM Map Dispatcher (OpenStreetMap)</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  
  <style>
    body { margin: 0; padding: 0; background: #09090b; }
    #map { width: 100vw; height: 100vh; }
    
    /* Custom Leaflet Dark Theme Adjustments */
    .leaflet-tile-pane {
        filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3) brightness(0.7);
    }
    
    body.theme-light .leaflet-tile-pane {
        filter: none !important;
    }
    
    /* Professional GeoSearch Bar Styling */
    .leaflet-control-geosearch.bar {
      position: fixed !important;
      top: 16px !important;
      left: 16px !important;
      right: 16px !important;
      width: auto !important;
      max-width: none !important;
      margin: 0 !important;
      z-index: 1000;
    }
    .leaflet-control-geosearch.bar form {
      width: 100% !important;
      box-sizing: border-box !important;
      background: #18181b !important;
      border: 3px solid #3b82f6 !important; /* Prominent Blue Border */
      border-radius: 16px !important;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.8) !important;
      padding: 8px !important;
      display: flex;
    }
    .leaflet-control-geosearch.bar form input {
      color: #fff !important;
      background: transparent !important;
      border: none !important;
      font-size: 16px !important;
      font-weight: 700 !important;
      padding: 12px 18px !important;
      outline: none !important;
      width: 100% !important;
    }
    .leaflet-control-geosearch.bar form input::placeholder {
      color: #a1a1aa !important;
      font-weight: 600 !important;
    }
    .leaflet-control-geosearch.bar form button {
      display: none !important;
    }
    .leaflet-control-geosearch .results {
      width: 100% !important;
      box-sizing: border-box !important;
      background: #18181b !important;
      border: 3px solid #3b82f6 !important;
      border-radius: 16px !important;
      margin-top: 12px !important;
      color: #fff !important;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.8) !important;
      max-height: 350px !important;
      overflow-y: auto !important;
    }
    .leaflet-control-geosearch .results > * {
      padding: 10px 14px !important;
      border-bottom: 1px solid #27272a !important;
      font-size: 13px !important;
      font-weight: 600 !important;
      line-height: 1.4 !important;
      white-space: normal !important;
      word-wrap: break-word !important;
    }
    .leaflet-control-geosearch .results > *:hover,
    .leaflet-control-geosearch .results > .active {
      background: rgba(59, 130, 246, 0.15) !important;
      color: #3b82f6 !important;
    }

    /* Light Theme Overrides for GeoSearch */
    body.theme-light .leaflet-control-geosearch.bar form,
    body.theme-light .leaflet-control-geosearch .results {
      background: #ffffff !important;
      border: 3px solid #2563eb !important;
      box-shadow: 0 12px 40px rgba(37, 99, 235, 0.2) !important;
    }
    body.theme-light .leaflet-control-geosearch.bar form input,
    body.theme-light .leaflet-control-geosearch .results > * {
      color: #000 !important;
    }
    body.theme-light .leaflet-control-geosearch.bar form input::placeholder {
      color: #52525b !important;
    }
    body.theme-light .leaflet-control-geosearch .results > * {
      border-bottom: 1px solid #e4e4e7 !important;
    }
  </style>
  
  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet-geosearch@latest/dist/geosearch.css" />
  <script src="https://unpkg.com/leaflet-geosearch@latest/dist/bundle.min.js"></script>
</head>
<body>
  <div id="map"></div>
  <script>
    let map;
    let pickupMarker;
    let dropoffMarker;
    let carMarker;
    let routeLayer;
    let nearbyDriverMarkers = [];

    // Custom Icons
    const greenIcon = L.icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
      shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
      iconSize: [25, 41],
      iconAnchor: [12, 41],
      popupAnchor: [1, -34],
      shadowSize: [41, 41]
    });

    const redIcon = L.icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
      shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
      iconSize: [25, 41],
      iconAnchor: [12, 41],
      popupAnchor: [1, -34],
      shadowSize: [41, 41]
    });

    const carIconSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><text y="24" font-size="24">🚗</text></svg>`;
    const carIcon = L.icon({
      iconUrl: 'data:image/svg+xml;utf-8,' + encodeURIComponent(carIconSvg),
      iconSize: [32, 32],
      iconAnchor: [16, 16]
    });

    const driverIconSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20"><text y="16" font-size="16">🚕</text></svg>`;
    const driverIcon = L.icon({
      iconUrl: 'data:image/svg+xml;utf-8,' + encodeURIComponent(driverIconSvg),
      iconSize: [20, 20],
      iconAnchor: [10, 10]
    });

    // Custom Provider that uses our backend to get local areas + photon
    class CustomProvider extends window.GeoSearch.JsonProvider {
      endpoint({ query }) {
        return `/api/geocode?q=${encodeURIComponent(query)}`;
      }
      parse({ data }) {
        if (!Array.isArray(data)) return [];
        return data.map(item => ({
          x: parseFloat(item.lon),
          y: parseFloat(item.lat),
          label: item.display_name.replace(/, India$/i, ''),
          bounds: [
            [parseFloat(item.lat) - 0.005, parseFloat(item.lon) - 0.005],
            [parseFloat(item.lat) + 0.005, parseFloat(item.lon) + 0.005]
          ]
        }));
      }
    }

    function initMap() {
      const defaultLoc = [9.9777, 76.2758]; // Kochi
      
      map = L.map('map', {
        zoomControl: false,
        attributionControl: false
      }).setView(defaultLoc, 13);
      
      L.control.zoom({ position: 'bottomright' }).addTo(map);

      // Add OpenStreetMap tiles
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
      }).addTo(map);

      // Initialize Pickup Marker
      pickupMarker = L.marker(defaultLoc, { icon: greenIcon, draggable: true }).addTo(map);

      // Add GeoSearch inside map
      const searchControl = new window.GeoSearch.GeoSearchControl({
        provider: new CustomProvider(),
        style: 'bar',
        showMarker: false,
        showPopup: false,
        autoClose: true,
        retainZoomLevel: false,
        animateZoom: true,
        keepResult: true,
        searchLabel: 'Search local areas...'
      });
      map.addControl(searchControl);

      map.on('geosearch/showlocation', function (e) {
        if (e && e.location) {
          const latlng = { lat: e.location.y, lng: e.location.x };
          pickupMarker.setLatLng(latlng);
          reverseGeocode(latlng);
        }
      });

      // Handle map clicks
      map.on('click', (e) => {
        if (carMarker) return; // Ride in progress
        pickupMarker.setLatLng(e.latlng);
        map.panTo(e.latlng);
        reverseGeocode(e.latlng);
      });

      // Handle marker drag
      pickupMarker.on('dragend', (e) => {
        reverseGeocode(pickupMarker.getLatLng());
      });

      locateUser(true);
    }

    async function reverseGeocode(latlng) {
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${latlng.lat}&lon=${latlng.lng}&format=json`);
        if (res.ok) {
          const data = await res.json();
          let address = data.display_name;
          if (address) address = address.replace(/, India$/i, '');
          window.parent.postMessage({ type: 'MAP_LOCATION_SELECTED', address: address || `${latlng.lat.toFixed(5)}, ${latlng.lng.toFixed(5)}`, lat: latlng.lat, lng: latlng.lng }, '*');
        } else {
          fallbackGeocode(latlng);
        }
      } catch (err) {
        fallbackGeocode(latlng);
      }
    }

    function fallbackGeocode(latlng) {
      window.parent.postMessage({ type: 'MAP_LOCATION_SELECTED', address: latlng.lat.toFixed(5) + ", " + latlng.lng.toFixed(5), lat: latlng.lat, lng: latlng.lng }, '*');
    }

    function locateUser(isSilent) {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            const pos = {
              lat: position.coords.latitude,
              lng: position.coords.longitude,
            };
            pickupMarker.setLatLng(pos);
            map.setView(pos, 16);
            reverseGeocode(pos);
          },
          () => {
            if (!isSilent) alert("Location permission denied. Defaulting to Kochi.");
          },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
        );
      } else {
        if (!isSilent) alert("Geolocation is not supported by this browser.");
      }
    }

    window.addEventListener('message', async function(event) {
      if (!event.data) return;
      
      if (event.data.type === 'SET_THEME') {
        if (event.data.theme === 'light') {
          document.body.classList.add('theme-light');
        } else {
          document.body.classList.remove('theme-light');
        }
        return;
      }

      if (event.data.type === 'SEARCH_PIN') {
        const { lat, lng } = event.data;
        const pos = { lat: parseFloat(lat), lng: parseFloat(lng) };
        pickupMarker.setLatLng(pos);
        map.setView(pos, 16);
        reverseGeocode(pos);
        return;
      }

      if (event.data.type === 'DRAW_ROUTE') {
        const pk = event.data.pickup;
        const dp = event.data.dropoff;

        if (dropoffMarker) map.removeLayer(dropoffMarker);
        if (carMarker) map.removeLayer(carMarker);
        if (routeLayer) map.removeLayer(routeLayer);
        
        pickupMarker.setLatLng([pk.lat, pk.lng]);
        dropoffMarker = L.marker([dp.lat, dp.lng], { icon: redIcon }).addTo(map);

        // Fetch route from OSRM
        try {
          const res = await fetch(`https://router.project-osrm.org/route/v1/driving/${pk.lng},${pk.lat};${dp.lng},${dp.lat}?overview=full&geometries=geojson`);
          if (res.ok) {
            const data = await res.json();
            if (data.routes && data.routes[0]) {
              const geojson = data.routes[0].geometry;
              routeLayer = L.geoJSON(geojson, {
                style: {
                  color: '#10b981',
                  weight: 5,
                  opacity: 0.8
                }
              }).addTo(map);
              map.fitBounds(routeLayer.getBounds(), { padding: [50, 50] });
            }
          } else {
            // Fallback straight line
            routeLayer = L.polyline([[pk.lat, pk.lng], [dp.lat, dp.lng]], { color: '#10b981', weight: 5, dashArray: '10, 10' }).addTo(map);
            map.fitBounds(routeLayer.getBounds(), { padding: [50, 50] });
          }
        } catch (e) {
          routeLayer = L.polyline([[pk.lat, pk.lng], [dp.lat, dp.lng]], { color: '#10b981', weight: 5, dashArray: '10, 10' }).addTo(map);
          map.fitBounds(routeLayer.getBounds(), { padding: [50, 50] });
        }
      }

      if (event.data.type === 'ANIMATE_CAR') {
        const pk = event.data.pickup;
        const dp = event.data.dropoff;

        if (carMarker) map.removeLayer(carMarker);

        carMarker = L.marker([pk.lat, pk.lng], { icon: carIcon }).addTo(map);

        let startTime = null;
        const duration = 9000;

        function animate(timestamp) {
          if (!startTime) startTime = timestamp;
          const progress = Math.min((timestamp - startTime) / duration, 1);

          const curLat = pk.lat + (dp.lat - pk.lat) * progress;
          const curLng = pk.lng + (dp.lng - pk.lng) * progress;
          
          carMarker.setLatLng([curLat, curLng]);

          if (progress < 1) {
            requestAnimationFrame(animate);
          } else {
            carMarker.bindPopup("<b>Arrived!</b>").openPopup();
          }
        }
        requestAnimationFrame(animate);
      }

      if (event.data.type === 'UPDATE_CAR_LOCATION') {
        const { lat, lng } = event.data;
        if (!carMarker) {
          carMarker = L.marker([lat, lng], { icon: carIcon }).addTo(map);
        } else {
          carMarker.setLatLng([lat, lng]);
        }
      }

      if (event.data.type === 'RESET_MAP') {
        if (dropoffMarker) map.removeLayer(dropoffMarker);
        if (carMarker) map.removeLayer(carMarker);
        if (routeLayer) map.removeLayer(routeLayer);
        nearbyDriverMarkers.forEach(m => map.removeLayer(m));
        nearbyDriverMarkers = [];
        
        locateUser(true);
      }

      if (event.data.type === 'SHOW_NEARBY_DRIVERS') {
        const drivers = event.data.drivers || [];
        nearbyDriverMarkers.forEach(m => map.removeLayer(m));
        nearbyDriverMarkers = [];
        
        drivers.forEach(driver => {
          const marker = L.marker([parseFloat(driver.lat), parseFloat(driver.lng)], { icon: driverIcon }).addTo(map);
          nearbyDriverMarkers.push(marker);
        });
      }
    });

    window.onload = initMap;
  </script>
</body>
</html>
